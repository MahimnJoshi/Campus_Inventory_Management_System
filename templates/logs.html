{% extends "base.html" %}
{% block title %}Activity Logs — CampusStock{% endblock %}

{% block head %}
<style>
  .logs-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .log-item {
    display: grid;
    grid-template-columns: 90px 80px 1fr 1fr 150px;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    font-size: .875rem;
    transition: background .15s;
  }
  .log-item:last-child { border: none; }
  .log-item:hover { background: var(--surface2); }
  .log-head {
    display: grid;
    grid-template-columns: 90px 80px 1fr 1fr 150px;
    gap: 12px;
    padding: 10px 18px;
    background: var(--surface2);
    font-size: .7rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .07em;
  }
  .action-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: .7rem;
    font-weight: 700;
  }
  .action-ADD { background: rgba(16,185,129,.12); color: var(--green); }
  .action-UPDATE { background: rgba(59,130,246,.12); color: var(--accent); }
  .action-DELETE { background: rgba(239,68,68,.12); color: var(--red); }
  .log-empty { text-align: center; padding: 50px; color: var(--muted); }
  .log-empty i { font-size: 2rem; margin-bottom: 12px; display: block; }
</style>
{% endblock %}

{% block content %}
<div class="topbar">
  <span class="topbar-title">Activity Logs</span>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" onclick="loadLogs()"><i class="fas fa-rotate-right"></i> Refresh</button>
  </div>
</div>
<div class="page-content">
  <div class="logs-card">
    <div class="log-head">
      <span>Action</span>
      <span>Item ID</span>
      <span>Item Name</span>
      <span>User</span>
      <span>Timestamp</span>
    </div>
    <div id="logsBody">
      <div class="log-empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function loadLogs() {
    const logs = await api('/api/logs');
    const body = document.getElementById('logsBody');
    if (!logs.length) {
      body.innerHTML = '<div class="log-empty"><i class="fas fa-clock-rotate-left"></i>No activity recorded yet.</div>';
      return;
    }
    const icons = { ADD: 'fa-plus', UPDATE: 'fa-pen', DELETE: 'fa-trash' };
    body.innerHTML = logs.map(l => `
      <div class="log-item">
        <span class="action-badge action-${l.action}">
          <i class="fas ${icons[l.action] || 'fa-circle'}"></i>${l.action}
        </span>
        <code style="font-size:.78rem;color:var(--accent)">${l.item_id}</code>
        <span>${l.item_name}</span>
        <span style="color:var(--muted)">${l.user}</span>
        <span style="color:var(--muted);font-size:.8rem">${l.timestamp}</span>
      </div>`).join('');
  }
  loadLogs();
</script>
{% endblock %}
