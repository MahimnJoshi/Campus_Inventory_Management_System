<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CampusStock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c14;
      --surface: #0e1623;
      --surface2: #151f30;
      --border: #1e2d44;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --red: #ef4444;
      --green: #10b981;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated grid bg */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: .25;
    }
    .glow-1 { width: 500px; height: 500px; background: #3b82f6; top: -150px; right: -100px; animation: drift 8s ease-in-out infinite alternate; }
    .glow-2 { width: 400px; height: 400px; background: #06b6d4; bottom: -100px; left: -100px; animation: drift 10s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(30px, 20px); } }

    .login-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(900px, 96vw);
      min-height: 560px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 32px 80px rgba(0,0,0,.6);
      position: relative;
      z-index: 1;
    }

    /* Left panel */
    .login-left {
      background: linear-gradient(145deg, #0d1929 0%, #0a1628 50%, #08101e 100%);
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .login-left::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,.2) 0%, transparent 70%);
      top: -80px; right: -80px;
      border-radius: 50%;
    }
    .brand { position: relative; }
    .brand h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }
    .brand h1 span { color: var(--accent); }
    .brand p { color: var(--muted); font-size: 0.875rem; line-height: 1.6; }
    .feature-list { position: relative; }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: #94a3b8;
      font-size: 0.875rem;
    }
    .feature-dot {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(59,130,246,.15);
      border: 1px solid rgba(59,130,246,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      color: var(--accent);
      flex-shrink: 0;
    }
    .version-tag {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: .05em;
    }

    /* Right panel */
    .login-right {
      background: var(--surface);
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-right h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-right .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 32px; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 7px;
    }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute;
      left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.85rem;
      pointer-events: none;
    }
    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px 12px 38px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }

    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }
    .role-tab {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
    }
    .role-tab.active {
      border-color: var(--accent);
      background: rgba(59,130,246,.1);
      color: var(--accent);
    }
    .role-tab small { display: block; font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(59,130,246,.3); }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading { pointer-events: none; opacity: .7; }

    .error-msg {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 640px) {
      .login-wrapper { grid-template-columns: 1fr; }
      .login-left { display: none; }
      .login-right { padding: 40px 28px; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="login-wrapper">
    <div class="login-left">
      <div class="brand">
        <h1>Campus<span>Stock</span></h1>
        <p>Cloud-based inventory management for modern educational institutions.</p>
      </div>
      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-dot"><i class="fas fa-layer-group"></i></div>
          Real-time asset tracking
        </div>
        <div class="feature-item">
          <div class="feature-dot"><i class="fas fa-qrcode"></i></div>
          QR code integration
        </div>
        <div class="feature-item">
          <div class="feature-dot"><i class="fas fa-chart-bar"></i></div>
          Analytics & reporting
        </div>
        <div class="feature-item">
          <div class="feature-dot"><i class="fas fa-shield-halved"></i></div>
          Role-based access control
        </div>
      </div>
      <div class="version-tag">v2.0 — Firebase Cloud Edition</div>
    </div>

    <div class="login-right">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to your campus account</p>

      <div class="role-tabs">
        <button class="role-tab active" onclick="fillDemo('admin')">
          <i class="fas fa-user-shield"></i> Admin
          <small>admin@campus.edu</small>
        </button>
        <button class="role-tab" onclick="fillDemo('staff')">
          <i class="fas fa-user"></i> Staff
          <small>staff@campus.edu</small>
        </button>
      </div>

      <div class="error-msg" id="error"></div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="you@campus.edu" autocomplete="email" />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <i class="fas fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.role-tab');
    function fillDemo(role) {
      tabs.forEach(t => t.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('email').value = role === 'admin' ? 'admin@campus.edu' : 'staff@campus.edu';
      document.getElementById('password').value = role === 'admin' ? 'admin123' : 'staff123';
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('error');

      if (!email || !password) { showError('Please fill in all fields.'); return; }
      btn.classList.add('loading');
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          showError(data.error || 'Invalid credentials');
          btn.classList.remove('loading');
          btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
        }
      } catch {
        showError('Connection error. Please try again.');
        btn.classList.remove('loading');
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // Pre-fill admin demo
    document.getElementById('email').value = 'admin@campus.edu';
    document.getElementById('password').value = 'admin123';
  </script>
</body>
</html>
